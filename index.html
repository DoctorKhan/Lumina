<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina | Markdown + LaTeX Editor</title>

    <link rel="stylesheet" href="/src/styles.css">

</head>
<body>
    <header class="min-h-16 shrink-0 border-b border-slate-800/80 flex items-center justify-between gap-3 px-4 sm:px-6 py-2 bg-slate-900/75 backdrop-blur min-w-0 relative z-20">
        <div class="flex items-center gap-3 min-w-0 flex-1">
            <div class="w-8 h-8 shrink-0 bg-gradient-to-br from-indigo-500 to-sky-500 rounded-lg flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">L</div>
            <h1 class="text-xl font-semibold tracking-tight text-slate-100 flex items-center gap-2 min-w-0">
                <span class="min-w-0 truncate">Lumina <span id="app-version-badge" class="text-slate-500 font-normal text-sm ml-2">v0.3.18</span></span>
                <button id="install-update-badge" type="button" class="update-install-badge hidden shrink-0" title="Install available update"></button>
            </h1>
        </div>
        <div class="flex items-center gap-2 min-w-0">
            <div class="flex flex-col items-end gap-1 min-w-0 w-full max-w-[min(20rem,calc(100vw-7rem))]">
                <div
                    id="install-progress"
                    class="install-progress hidden w-full min-w-0"
                    aria-label="Install progress"
                    role="status"
                    aria-live="polite"
                >
                    <div class="install-progress-card">
                        <div class="install-progress-card-head">
                            <div class="install-progress-card-label">
                                <span class="install-progress-icon" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path
                                            d="M12 3v10m0 0l-3.5-3.5M12 13l3.5-3.5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"
                                            stroke="currentColor"
                                            stroke-width="1.8"
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                        />
                                    </svg>
                                </span>
                                <span class="install-progress-eyebrow">Update</span>
                            </div>
                            <span id="install-progress-percent" class="install-progress-pct" translate="no">—</span>
                        </div>
                        <div class="install-progress-track" aria-hidden="true">
                            <div id="install-progress-fill" class="install-progress-fill" style="width: 0%"></div>
                        </div>
                        <p id="install-progress-detail" class="install-progress-detail" title=""></p>
                    </div>
                </div>
                <span id="update-status" class="update-status-line text-xs text-slate-500" title="">Not checked</span>
            </div>
            <div class="h-6 w-px shrink-0 bg-slate-800" aria-hidden="true"></div>
            <div class="flex items-center gap-1 shrink-0" aria-label="Pane controls">
                <button id="toggle-source-btn" type="button" class="pane-toggle-btn rounded-md p-2 text-slate-400 hover:text-slate-100 hover:bg-slate-800 transition-colors" title="Hide source pane" aria-label="Toggle source pane" aria-pressed="true">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"/><path d="m10 8-4 4 4 4"/><path d="m14 8 4 4-4 4"/></svg>
                </button>
                <button id="toggle-terminal-btn" type="button" class="pane-toggle-btn rounded-md p-2 text-slate-400 hover:text-slate-100 hover:bg-slate-800 transition-colors" title="Show terminal" aria-label="Toggle terminal pane" aria-pressed="false">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></svg>
                </button>
                <button id="toggle-git-btn" type="button" class="pane-toggle-btn rounded-md p-2 text-slate-400 hover:text-slate-100 hover:bg-slate-800 transition-colors" title="Show Git" aria-label="Toggle Git pane" aria-pressed="false">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>
                </button>
                <button id="toggle-claude-btn" type="button" class="pane-toggle-btn rounded-md px-2 py-1.5 text-sm font-semibold text-violet-300 hover:text-white hover:bg-violet-900/70 transition-colors" title="Show Claude" aria-label="Toggle Claude pane" aria-pressed="false">C</button>
            </div>
            <input type="file" id="file-input" accept=".md,.txt,.markdown">
        </div>
    </header>

    <main class="editor-container flex w-full">
        <div id="workspace-panes" class="workspace-panes flex min-w-0">
            <div class="editor-pane flex-1 flex flex-col min-w-0">
                <div class="editor-meta-bar bg-slate-800/85 flex flex-col border-b border-slate-700/70">
                    <div class="editor-meta-bar-row h-10 flex items-center gap-3 px-4 text-xs font-medium uppercase tracking-wider text-slate-400 justify-between">
                    <div class="filename-display-wrap min-w-0 flex-1">
                        <div id="filename-path-view" class="filename-path-view">
                            <button type="button" id="filename-display" class="filename-display-btn" title="Click to open another file by path">
                                <span class="filename-marquee-track">
                                    <span id="filename-display-text" class="filename-display-text">Editor (Markdown + LaTeX)</span>
                                </span>
                            </button>
                            <button type="button" id="filename-copy-btn" class="filename-copy-btn hidden" title="Copy full path" aria-label="Copy full path">⎘</button>
                        </div>
                        <div id="filename-path-editor" class="filename-path-editor hidden">
                            <input id="filename-path-input" class="filename-path-input" type="text" spellcheck="false" autocomplete="off" aria-label="File path" />
                            <button type="button" id="filename-path-open-btn" class="filename-path-action-btn">Open</button>
                            <button type="button" id="filename-path-cancel-btn" class="filename-path-action-btn">Cancel</button>
                        </div>
                        <ul id="filename-path-suggestions" class="filename-path-suggestions hidden" role="listbox" aria-label="Path suggestions"></ul>
                    </div>
                    <button id="fix-latex-btn" type="button" class="shrink-0 rounded px-2 py-0.5 text-[11px] font-semibold normal-case tracking-normal text-slate-400 hover:text-slate-100 hover:bg-slate-700 transition-colors" title="Normalize LaTeX delimiters in source (converts \[…\] and \(…\) to $$ and $)">Fix LaTeX</button>
                    <span id="char-count" class="shrink-0 whitespace-nowrap text-right normal-case tracking-normal">0 chars</span>
                    </div>
                    <div id="filename-path-toast" class="filename-path-toast hidden" role="status" aria-live="polite"></div>
                </div>
                <div id="find-replace-bar" class="find-replace-bar hidden" role="search" aria-label="Find and replace">
                    <div class="find-replace-row">
                        <label class="find-replace-label" for="find-input">Find</label>
                        <input id="find-input" type="search" class="find-replace-input" placeholder="Find…" autocomplete="off" spellcheck="false" />
                        <span id="find-match-status" class="find-match-status" aria-live="polite"></span>
                        <div class="find-replace-actions">
                            <button id="find-prev-btn" type="button" class="find-replace-btn" title="Previous match (⌘⇧G)">↑</button>
                            <button id="find-next-btn" type="button" class="find-replace-btn" title="Next match (⌘G)">↓</button>
                        </div>
                    </div>
                    <div id="find-replace-replace-row" class="find-replace-row hidden">
                        <label class="find-replace-label" for="replace-input">Replace</label>
                        <input id="replace-input" type="text" class="find-replace-input" placeholder="Replace…" autocomplete="off" spellcheck="false" />
                        <div class="find-replace-actions">
                            <button id="replace-btn" type="button" class="find-replace-btn find-replace-btn-primary" title="Replace (Enter)">Replace</button>
                            <button id="replace-all-btn" type="button" class="find-replace-btn" title="Replace all">All</button>
                        </div>
                    </div>
                    <button id="find-replace-close-btn" type="button" class="find-replace-close-btn" title="Close (Esc)" aria-label="Close find and replace">×</button>
                </div>
                <textarea id="editor" class="flex-1 p-6 leading-relaxed" spellcheck="false" placeholder="Start typing your masterpiece..."></textarea>
            </div>

            <div id="pane-resizer" class="pane-resizer" aria-hidden="true"></div>

            <div class="preview-pane flex-1 flex flex-col min-w-0 border-l border-slate-800">
                <div class="h-10 bg-slate-100 flex items-center px-4 text-xs font-medium uppercase tracking-wider text-slate-600 border-b border-slate-200">
                    Live Preview
                </div>
                <div id="preview" class="flex-1 p-8 overflow-y-auto prose max-w-none"></div>
            </div>
        </div>

        <div id="side-pane-resizer" class="pane-resizer side-pane-resizer hidden" aria-hidden="true"></div>

        <div id="side-pane" class="side-pane hidden flex flex-col min-w-0 border-l border-slate-800">
            <aside id="terminal-pane" class="terminal-pane hidden flex flex-col min-w-0">
                <div class="h-10 bg-slate-950 flex items-center px-4 text-xs font-medium uppercase tracking-wider text-slate-400 justify-between border-b border-slate-800 shrink-0">
                    <span>Terminal</span>
                    <div class="flex items-center gap-3">
                        <span id="terminal-status" class="normal-case tracking-normal text-slate-500">Stopped</span>
                        <button id="close-terminal-btn" class="text-slate-400 hover:text-slate-100 transition-colors" title="Hide terminal">Close</button>
                    </div>
                </div>
                <!-- xterm FitAddon uses parentElement height; this wrapper is only the area below the title bar so row count is not inflated by the header. -->
                <div class="flex-1 min-h-0 min-w-0 flex flex-col">
                    <div id="terminal" class="flex-1 min-h-0 min-w-0"></div>
                </div>
            </aside>

            <aside id="claude-pane" class="terminal-pane hidden flex flex-col min-w-0">
                <div class="h-10 bg-violet-950 flex items-center gap-3 px-4 text-xs font-medium text-violet-200 border-b border-violet-900 shrink-0">
                    <div class="min-w-0 flex-1">
                        <div class="flex items-center gap-2">
                            <span class="uppercase tracking-wider">Claude</span>
                            <span id="claude-status" class="normal-case tracking-normal text-violet-300/70">Stopped</span>
                        </div>
                        <div id="claude-workspace-status" class="truncate text-[11px] font-normal normal-case tracking-normal text-violet-200/45" title="">No file attached</div>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button id="claude-develop-lumina-btn" class="claude-action-button hidden" title="Edit Lumina's own source code with Claude" aria-pressed="false">Lumina src</button>
                        <button id="claude-rebuild-lumina-btn" class="claude-action-button claude-action-primary hidden" title="Rebuild Lumina from the source checkout and reinstall">Rebuild &amp; Install</button>
                        <button id="claude-send-context-btn" class="claude-action-button claude-action-primary" title="Send file, cursor, and selected text context to Claude">Send Context</button>
                        <button id="claude-presets-btn" class="claude-action-button" title="Choose a preset Claude prompt">Prompt...</button>
                        <div class="relative">
                            <button id="claude-apply-menu-btn" class="claude-action-button" title="Apply Claude changes back to Lumina">Apply</button>
                            <div id="claude-apply-menu" class="claude-action-menu hidden">
                                <button id="claude-pull-file-btn" title="Load Claude's edited file into the editor">Pull edited file</button>
                                <button id="claude-replace-selection-btn" title="Replace the current selection with clipboard text">Replace selection from clipboard</button>
                            </div>
                        </div>
                        <button id="close-claude-btn" class="claude-icon-button" title="Hide Claude" aria-label="Hide Claude">×</button>
                    </div>
                </div>
                <div class="flex-1 min-h-0 min-w-0 flex flex-col">
                    <div id="claude-terminal" class="flex-1 min-h-0 min-w-0"></div>
                </div>
            </aside>

            <aside id="git-pane" class="terminal-pane git-pane hidden flex flex-col min-w-0">
                <div class="h-10 bg-slate-950 flex items-center gap-3 px-4 text-xs font-medium text-slate-300 border-b border-slate-800 shrink-0">
                    <div class="min-w-0 flex-1 flex items-center gap-2">
                        <span class="uppercase tracking-wider shrink-0">Git</span>
                        <span id="git-branch" class="normal-case tracking-normal text-slate-400 truncate" title=""></span>
                        <span id="git-tracking" class="normal-case tracking-normal text-slate-500 shrink-0"></span>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                        <button id="git-pull-btn" class="git-action-button" title="Pull (fast-forward only)">Pull</button>
                        <button id="git-push-btn" class="git-action-button" title="Push to upstream">Push</button>
                        <button id="git-refresh-btn" class="git-action-button" title="Refresh status" aria-label="Refresh git status">↻</button>
                        <button id="close-git-btn" class="claude-icon-button" title="Hide Git" aria-label="Hide Git">×</button>
                    </div>
                </div>
                <div class="flex-1 min-h-0 overflow-y-auto git-body">
                    <div id="git-message" class="git-message hidden" role="status" aria-live="polite"></div>
                    <div id="git-sections" class="git-sections"></div>
                    <div id="git-diff" class="git-diff hidden"></div>
                </div>
                <div class="git-commit-bar shrink-0">
                    <textarea id="git-commit-message" class="git-commit-input" rows="2" placeholder="Commit message… (⌘↵ to commit)" spellcheck="false"></textarea>
                    <button id="git-commit-btn" class="git-action-button git-action-primary" title="Commit staged changes">Commit</button>
                </div>
            </aside>
        </div>
    </main>

    <script type="module" src="/src/main.js"></script>

</body>
</html>
