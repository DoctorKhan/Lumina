<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina | Markdown + LaTeX Editor</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Fira+Code:wght@400;500&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(1200px 600px at 10% -20%, rgba(99, 102, 241, 0.18), transparent 65%),
                radial-gradient(900px 500px at 90% -30%, rgba(14, 165, 233, 0.14), transparent 60%),
                #0b1120;
            color: #e2e8f0;
            overflow: hidden;
        }

        .editor-container {
            height: calc(100vh - 64px);
        }

        .editor-collapsed .editor-pane {
            display: none;
        }

        .editor-collapsed .pane-resizer {
            display: none;
        }

        .editor-collapsed .preview-pane {
            flex: 1 1 100%;
        }

        .editor-collapsed .preview-pane {
            border-left: none;
        }

        #editor {
            font-family: 'Fira Code', monospace;
            resize: none;
            outline: none;
            background: linear-gradient(180deg, #172036 0%, #141c30 100%);
            color: #d9e2ef;
            scrollbar-width: thin;
            scrollbar-color: #475569 transparent;
            font-size: 0.97rem;
        }

        .pane-resizer {
            width: 6px;
            cursor: col-resize;
            background: #111a2f;
            border-left: 1px solid #223150;
            border-right: 1px solid #223150;
            transition: background-color 120ms ease;
        }

        .pane-resizer:hover,
        .pane-resizer.dragging {
            background: #334155;
        }

        #preview {
            background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
            color: #1f2937;
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
        }

        .terminal-pane {
            flex: 0 0 34%;
            min-width: 320px;
            min-height: 0;
            background: #070b16;
        }

        .terminal-pane.hidden {
            display: none;
        }

        #terminal {
            height: 100%;
            min-height: 0;
            box-sizing: border-box;
            overflow: hidden;
            padding: 0.5rem;
        }

        #terminal .xterm {
            height: 100%;
        }

        #terminal .xterm-viewport {
            background-color: transparent;
        }

        .prose h1 { border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; margin-top: 1.5rem; font-weight: 700; font-size: 2.1rem; letter-spacing: -0.02em; }
        .prose h2 { border-bottom: 1px solid #e2e8f0; padding-bottom: 0.35rem; margin-top: 1.2rem; font-weight: 650; font-size: 1.65rem; letter-spacing: -0.01em; }
        .prose h3 { font-weight: 620; font-size: 1.35rem; }
        .prose p { margin: 0.95rem 0; line-height: 1.78; }
        .prose code:not(pre code) { background: #eef2ff; padding: 0.18rem 0.45rem; border-radius: 6px; font-family: 'Fira Code', monospace; font-size: 0.89em; color: #be123c; }
        .prose pre { background: #1a2338; border-radius: 10px; padding: 1rem; overflow-x: auto; margin: 1rem 0; box-shadow: 0 8px 22px rgba(15, 23, 42, 0.18); }
        .prose blockquote { border-left: 4px solid #cbd5e1; padding-left: 1rem; font-style: italic; color: #64748b; margin: 1rem 0; background: #f8fafc; border-radius: 0 8px 8px 0; }
        .prose ul, .prose ol { margin-left: 1.5rem; margin-bottom: 1rem; }
        .prose li { margin: 0.28rem 0; }
        .prose img { max-width: 100%; border-radius: 10px; margin: 1rem auto; display: block; box-shadow: 0 10px 24px rgba(15, 23, 42, 0.12); }
        .prose table { width: 100%; border-collapse: collapse; margin: 1rem 0; overflow: hidden; border-radius: 10px; }
        .prose th, .prose td { border: 1px solid #e2e8f0; padding: 0.55rem; text-align: left; }
        .prose th { background: #f1f5f9; }

        .katex-display { margin: 1.5em 0; overflow-x: auto; overflow-y: hidden; }
        .mermaid { margin: 1.25rem 0; }

        #file-input {
            display: none;
        }
    </style>
</head>
<body>
    <header class="h-16 border-b border-slate-800/80 flex items-center justify-between px-6 bg-slate-900/75 backdrop-blur">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-gradient-to-br from-indigo-500 to-sky-500 rounded-lg flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">L</div>
            <h1 class="text-xl font-semibold tracking-tight text-slate-100">Lumina <span id="app-version-badge" class="text-slate-500 font-normal text-sm ml-2">v0.1.4</span></h1>
        </div>
        <div class="flex items-center gap-2">
            <a
                href="https://github.com/DoctorKhan/Lumina"
                target="_blank"
                rel="noopener noreferrer"
                title="Contribute on GitHub"
                class="text-sm px-4 py-2 rounded-md bg-slate-800/90 hover:bg-slate-700 text-slate-200 transition-colors"
            >
                Contribute
            </a>
            <button id="check-update-btn" title="Check GitHub releases for updates" class="text-sm px-4 py-2 rounded-md bg-slate-800/90 hover:bg-slate-700 text-slate-200 transition-colors">Check Updates</button>
            <button id="install-update-btn" title="Install the detected GitHub release" class="hidden text-sm px-4 py-2 rounded-md bg-emerald-700 hover:bg-emerald-600 text-white font-medium transition-colors">Install Update</button>
            <button id="install-checkout-btn" title="Install this local checkout" class="hidden text-sm px-4 py-2 rounded-md bg-amber-700 hover:bg-amber-600 text-white font-medium transition-colors">Install Current Checkout</button>
            <span id="update-status" class="max-w-48 truncate text-xs text-slate-500" title="">Not checked</span>
            <input type="file" id="file-input" accept=".md,.txt,.markdown">
            <button id="open-file-btn" title="Open file (Cmd/Ctrl+O)" class="text-sm px-4 py-2 rounded-md bg-slate-800/90 hover:bg-slate-700 text-slate-200 transition-colors flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M9 15h6"/><path d="M12 12v6"/></svg>
                Open File
            </button>
            <button id="download-btn" title="Download markdown (Cmd/Ctrl+S)" class="text-sm px-4 py-2 rounded-md bg-slate-800/90 hover:bg-slate-700 text-slate-200 transition-colors">Download .md</button>
            <button id="copy-html-btn" title="Copy preview HTML (Cmd/Ctrl+Shift+C)" class="text-sm px-4 py-2 rounded-md bg-gradient-to-r from-indigo-600 to-sky-600 hover:from-indigo-500 hover:to-sky-500 text-white font-medium transition-colors">Copy HTML</button>
            <button id="toggle-source-btn" class="text-sm px-4 py-2 rounded-md bg-slate-800/90 hover:bg-slate-700 text-slate-200 transition-colors">Hide Source</button>
            <button id="toggle-terminal-btn" title="Toggle terminal (Cmd/Ctrl+`)" class="text-sm px-4 py-2 rounded-md bg-slate-800/90 hover:bg-slate-700 text-slate-200 transition-colors">Hide Terminal</button>
        </div>
    </header>

    <main class="editor-container flex w-full">
        <div class="editor-pane flex-1 flex flex-col min-w-0">
            <div class="h-10 bg-slate-800/85 flex items-center px-4 text-xs font-medium uppercase tracking-wider text-slate-400 justify-between border-b border-slate-700/70">
                <span id="filename-display">Editor (Markdown + LaTeX)</span>
                <span id="char-count">0 chars</span>
            </div>
            <textarea id="editor" class="flex-1 p-6 leading-relaxed" spellcheck="false" placeholder="Start typing your masterpiece..."></textarea>
        </div>

        <div id="pane-resizer" class="pane-resizer" aria-hidden="true"></div>

        <div class="preview-pane flex-1 flex flex-col min-w-0 border-l border-slate-800">
            <div class="h-10 bg-slate-100 flex items-center px-4 text-xs font-medium uppercase tracking-wider text-slate-600 border-b border-slate-200">
                Live Preview
            </div>
            <div id="preview" class="flex-1 p-8 overflow-y-auto prose max-w-none"></div>
        </div>

        <aside id="terminal-pane" class="terminal-pane flex flex-col min-w-0 border-l border-slate-800">
            <div class="h-10 bg-slate-950 flex items-center px-4 text-xs font-medium uppercase tracking-wider text-slate-400 justify-between border-b border-slate-800">
                <span>Terminal</span>
                <div class="flex items-center gap-3">
                    <span id="terminal-status" class="normal-case tracking-normal text-slate-500">Stopped</span>
                    <button id="close-terminal-btn" class="text-slate-400 hover:text-slate-100 transition-colors" title="Hide terminal">Close</button>
                </div>
            </div>
            <div id="terminal" class="flex-1 min-h-0"></div>
        </aside>
    </main>

    <script type="module">
        import { invoke } from '@tauri-apps/api/core';
        import { listen } from '@tauri-apps/api/event';
        import { Terminal } from '@xterm/xterm';
        import { FitAddon } from '@xterm/addon-fit';
        import '@xterm/xterm/css/xterm.css';

        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        const charCount = document.getElementById('char-count');
        const fileInput = document.getElementById('file-input');
        const filenameDisplay = document.getElementById('filename-display');
        const openFileBtn = document.getElementById('open-file-btn');
        const downloadBtn = document.getElementById('download-btn');
        const copyHtmlBtn = document.getElementById('copy-html-btn');
        const checkUpdateBtn = document.getElementById('check-update-btn');
        const installUpdateBtn = document.getElementById('install-update-btn');
        const installCheckoutBtn = document.getElementById('install-checkout-btn');
        const updateStatus = document.getElementById('update-status');
        const toggleSourceBtn = document.getElementById('toggle-source-btn');
        const toggleTerminalBtn = document.getElementById('toggle-terminal-btn');
        const closeTerminalBtn = document.getElementById('close-terminal-btn');
        const terminalPane = document.getElementById('terminal-pane');
        const terminalElement = document.getElementById('terminal');
        const terminalStatus = document.getElementById('terminal-status');
        const editorContainer = document.querySelector('.editor-container');
        const editorPane = document.querySelector('.editor-pane');
        const previewPane = document.querySelector('.preview-pane');
        const paneResizer = document.getElementById('pane-resizer');
        let mermaidInitialized = false;
        let sourceCollapsed = false;
        let isResizing = false;
        let terminal = null;
        let fitAddon = null;
        let terminalVisible = true;
        let terminalStarted = false;
        let terminalOutputUnlisten = null;
        let terminalResizeFrame = null;
        let terminalInputBuffer = '';
        let latestReleaseTag = null;
        let currentCheckoutInstallCommand = null;
        const releaseApiUrl = 'https://api.github.com/repos/DoctorKhan/Lumina/releases/latest';
        const publicInstallerUrl = 'https://raw.githubusercontent.com/DoctorKhan/Lumina/main/install.sh';
        const currentVersion = document.getElementById('app-version-badge').textContent.trim().replace(/^v/i, '');

        marked.setOptions({
            // Keep default markdown line-break behavior so multiline KaTeX
            // blocks are not split by injected <br> nodes.
            breaks: false,
            gfm: true
        });

        const renderer = new marked.Renderer();
        renderer.code = (code, infostring) => {
            const language = (infostring || '').trim().toLowerCase();
            if (language === 'mermaid') {
                return `<pre class="mermaid">${code}</pre>`;
            }
            const escapedCode = code
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;');
            const className = language ? `language-${language}` : '';
            return `<pre><code class="${className}">${escapedCode}</code></pre>`;
        };
        marked.use({ renderer });

        const initialValue = `# Welcome to Lumina

Lumina is a high-performance Markdown editor with built-in support for **LaTeX** mathematics.

## 1. Mathematical Notation
You can write inline math using single dollar signs, like $E = mc^2$, or block math using double dollar signs:

$$\\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}$$

Complex calculus works perfectly too:

$$\\oint_{\\partial \\Sigma} \\mathbf{E} \\cdot d\\boldsymbol{\\ell} = -\\frac{d}{dt} \\iint_{\\Sigma} \\mathbf{B} \\cdot d\\mathbf{S}$$

## 2. Code Blocks
Syntax highlighting is automatically applied:

\`\`\`javascript
function helloWorld() {
  console.log("Hello, Lumina!");
}
\`\`\`

## 3. Features
* **Real-time Rendering**: See changes as you type.
* **File Support**: Open local .md files directly.
* **GFM Support**: GitHub Flavored Markdown tables and lists.

| Feature | Support |
| :--- | :--- |
| LaTeX | Full |
| Tables | Yes |
| Task Lists | [x] |

Enjoy writing!
`;

        editor.value = initialValue;

        function schedulePreviewUpdate() {
            preview.innerHTML = '<p class="text-slate-500">Rendering preview...</p>';
            requestAnimationFrame(() => {
                updatePreview();
            });
        }

        function setEditorContent(content, label) {
            editor.value = content;
            filenameDisplay.textContent = label;
            charCount.textContent = `${content.length} chars`;
            schedulePreviewUpdate();
        }

        function highlightCodeBlocks() {
            const blocks = preview.querySelectorAll('pre code:not(.language-mermaid)');
            blocks.forEach((block) => hljs.highlightElement(block));
        }

        async function renderMermaidBlocks() {
            const blocks = preview.querySelectorAll('pre.mermaid');
            if (blocks.length === 0) return;

            if (!mermaidInitialized) {
                mermaid.initialize({
                    startOnLoad: false,
                    securityLevel: 'loose',
                    theme: 'default'
                });
                mermaidInitialized = true;
            }

            for (const block of blocks) {
                const source = block.textContent || '';
                const id = `mermaid-${Date.now()}-${Math.random().toString(36).slice(2)}`;
                try {
                    const { svg } = await mermaid.render(id, source);
                    const wrapper = document.createElement('div');
                    wrapper.className = 'mermaid';
                    wrapper.innerHTML = svg;
                    block.replaceWith(wrapper);
                } catch (error) {
                    const fallback = document.createElement('pre');
                    fallback.className = 'bg-rose-50 text-rose-700 p-3 rounded';
                    fallback.textContent = `Mermaid render error:\n${error?.message || String(error)}`;
                    block.replaceWith(fallback);
                }
            }
        }

        function looksLikeLatexBlock(lines) {
            const body = lines.join('\n').trim();
            if (!body) return false;

            // Heuristic signals for math/LaTeX content.
            return /\\[a-zA-Z]+/.test(body) ||          // \frac, \begin, \sum, ...
                /[_^]/.test(body) ||                    // x_i, x^2
                /\{.*\}/.test(body) ||                  // grouped LaTeX terms
                /\\begin\{.*\}|\\end\{.*\}/.test(body) ||
                /\\\\/.test(body) ||                    // line breaks in cases/aligned
                /\b(min|max|sin|cos|log)\b/.test(body); // common math tokens
        }

        function normalizeMathBlocks(input) {
            // Detect standalone bracket blocks that are likely LaTeX and
            // convert only those to $$...$$. Leaves non-math brackets unchanged.
            const lines = input.split('\n');
            const output = [];
            let inCodeFence = false;
            let bracketStart = -1;
            let bracketBody = [];

            for (const line of lines) {
                const trimmed = line.trim();

                if (trimmed.startsWith('```')) {
                    if (bracketStart !== -1) {
                        output.push('[');
                        output.push(...bracketBody);
                        bracketStart = -1;
                        bracketBody = [];
                    }
                    inCodeFence = !inCodeFence;
                    output.push(line);
                    continue;
                }

                if (inCodeFence) {
                    output.push(line);
                    continue;
                }

                if (bracketStart === -1 && trimmed === '[') {
                    bracketStart = output.length;
                    bracketBody = [];
                    continue;
                }

                if (bracketStart !== -1 && trimmed === ']') {
                    if (looksLikeLatexBlock(bracketBody)) {
                        output.push('$$');
                        output.push(...bracketBody);
                        output.push('$$');
                    } else {
                        output.push('[');
                        output.push(...bracketBody);
                        output.push(']');
                    }
                    bracketStart = -1;
                    bracketBody = [];
                    continue;
                }

                if (bracketStart !== -1) {
                    bracketBody.push(line);
                    continue;
                }

                output.push(line);
            }

            // Unclosed bracket block: keep original text verbatim.
            if (bracketStart !== -1) {
                output.push('[');
                output.push(...bracketBody);
            }

            return output.join('\n');
        }

        function normalizeEscapedLatexDelimiters(input) {
            // Convert escaped LaTeX delimiters into dollar delimiters before
            // Markdown parsing, so marked does not swallow the backslashes.
            // Display math: \[ ... \] -> $$ ... $$
            let output = input.replace(/\\\[\s*([\s\S]*?)\s*\\\]/g, (_, expr) => {
                return `$$\n${expr.trim()}\n$$`;
            });

            // Inline math: \( ... \) -> $ ... $
            output = output.replace(/\\\((.*?)\\\)/g, (_, expr) => {
                return `$${expr.trim()}$`;
            });

            return output;
        }

        async function updatePreview() {
            const rawValue = editor.value;
            const wordCount = rawValue.trim() ? rawValue.trim().split(/\s+/).length : 0;
            charCount.textContent = `${rawValue.length} chars • ${wordCount} words`;
            const normalizedValue = normalizeEscapedLatexDelimiters(
                normalizeMathBlocks(rawValue)
            );
            preview.innerHTML = marked.parse(normalizedValue);
            highlightCodeBlocks();
            await renderMermaidBlocks();

            renderMathInElement(preview, {
                delimiters: [
                    { left: '$$', right: '$$', display: true },
                    { left: '$', right: '$', display: false },
                    { left: '\\(', right: '\\)', display: false },
                    { left: '\\[', right: '\\]', display: true }
                ],
                throwOnError: false
            });
        }

        function downloadContent() {
            const blob = new Blob([editor.value], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `lumina-document-${Date.now()}.md`;
            link.click();
            URL.revokeObjectURL(url);
        }

        async function copyToClipboard(button) {
            try {
                await navigator.clipboard.writeText(preview.innerHTML);
            } catch (_) {
                const fallback = document.createElement('textarea');
                fallback.value = preview.innerHTML;
                document.body.appendChild(fallback);
                fallback.select();
                document.execCommand('copy');
                document.body.removeChild(fallback);
            }

            const originalText = button.textContent;
            button.textContent = 'Copied!';
            button.classList.add('bg-green-600');
            button.classList.remove('bg-indigo-600');

            setTimeout(() => {
                button.textContent = originalText;
                button.classList.add('bg-indigo-600');
                button.classList.remove('bg-green-600');
            }, 2000);
        }

        function setUpdateStatus(message) {
            updateStatus.textContent = message;
            updateStatus.title = message;
        }

        function parseVersion(value) {
            const match = String(value || '').match(/v?(\d+)\.(\d+)\.(\d+)/i);
            if (!match) return null;
            return match.slice(1).map((part) => Number(part));
        }

        function compareVersions(left, right) {
            const a = parseVersion(left);
            const b = parseVersion(right);
            if (!a || !b) return 0;

            for (let i = 0; i < 3; i += 1) {
                if (a[i] !== b[i]) return a[i] - b[i];
            }

            return 0;
        }

        function shellQuote(value) {
            return `'${String(value).replaceAll("'", "'\\''")}'`;
        }

        function releaseInstallCommand(tagName) {
            return `curl -fsSL ${publicInstallerUrl} | GIT_REF=${shellQuote(tagName)} bash`;
        }

        async function runCommandInTerminal(command, label) {
            await toggleTerminal(true);
            terminal?.write(`\r\n${label}\r\n$ ${command}\r\n`);
            terminal?.scrollToBottom();
            await invoke('terminal_write', { data: `${command}\r` });
            terminal?.focus();
        }

        async function checkForUpdate() {
            checkUpdateBtn.disabled = true;
            installUpdateBtn.classList.add('hidden');
            latestReleaseTag = null;
            setUpdateStatus('Checking GitHub releases...');

            try {
                const response = await fetch(releaseApiUrl, {
                    headers: { Accept: 'application/vnd.github+json' },
                    cache: 'no-store'
                });

                if (response.status === 404) {
                    setUpdateStatus('No GitHub releases published yet.');
                    return;
                }

                if (!response.ok) {
                    throw new Error(`GitHub returned ${response.status}`);
                }

                const release = await response.json();
                const tagName = release.tag_name || '';
                const latestVersion = parseVersion(tagName);

                if (!latestVersion) {
                    setUpdateStatus(`Latest release has an unexpected tag: ${tagName || 'unknown'}`);
                    return;
                }

                if (compareVersions(tagName, currentVersion) > 0) {
                    latestReleaseTag = tagName;
                    installUpdateBtn.classList.remove('hidden');
                    setUpdateStatus(`Update available: ${tagName}`);
                } else {
                    setUpdateStatus(`Up to date: v${currentVersion}`);
                }
            } catch (error) {
                setUpdateStatus(`Update check failed: ${error?.message || error}`);
            } finally {
                checkUpdateBtn.disabled = false;
            }
        }

        async function installDetectedUpdate() {
            if (!latestReleaseTag) {
                setUpdateStatus('Check for updates first.');
                return;
            }

            const confirmed = window.confirm(
                `Install Lumina ${latestReleaseTag} from GitHub?\n\nThis runs the public install.sh script and rebuilds the app locally.`
            );
            if (!confirmed) return;

            installUpdateBtn.disabled = true;
            setUpdateStatus(`Installing ${latestReleaseTag}; see terminal.`);
            await runCommandInTerminal(
                releaseInstallCommand(latestReleaseTag),
                `Installing Lumina ${latestReleaseTag} from GitHub releases...`
            );
            installUpdateBtn.disabled = false;
        }

        async function loadCurrentCheckoutInstaller() {
            try {
                const info = await invoke('current_checkout_install_info');
                if (!info.available || !info.command) return;

                currentCheckoutInstallCommand = info.command;
                installCheckoutBtn.title = info.label;
                installCheckoutBtn.classList.remove('hidden');
            } catch (_) {
                installCheckoutBtn.classList.add('hidden');
            }
        }

        async function installCurrentCheckout() {
            if (!currentCheckoutInstallCommand) return;

            const confirmed = window.confirm(
                'Install the current local checkout into /Applications?\n\nUse this only for development and local testing, not normal user updates.'
            );
            if (!confirmed) return;

            installCheckoutBtn.disabled = true;
            await runCommandInTerminal(
                currentCheckoutInstallCommand,
                'Installing the current local checkout...'
            );
            installCheckoutBtn.disabled = false;
        }

        function cleanTerminalPath(path) {
            return path
                .trim()
                .replace(/^[<("'`]+/, '')
                .replace(/[>)"'`,;.]+$/, '');
        }

        function handleTerminalCommandInput(data) {
            if (data === '\u0003') {
                terminalInputBuffer = '';
                return;
            }

            if (data === '\u007f') {
                terminalInputBuffer = terminalInputBuffer.slice(0, -1);
                return;
            }

            if (data === '\r') {
                const command = terminalInputBuffer.trim();
                terminalInputBuffer = '';
                const cdMatch = command.match(/^cd(?:\s+(.+))?$/);
                if (cdMatch) {
                    const target = cdMatch[1]?.trim() || '~';
                    invoke('terminal_set_cwd', { path: target }).catch(() => {});
                }
                return;
            }

            if (/^[\x20-\x7e]+$/.test(data)) {
                terminalInputBuffer += data;
            }
        }

        async function openClickedTerminalFile(path) {
            const cleanPath = cleanTerminalPath(path);
            if (!cleanPath) return;

            try {
                filenameDisplay.textContent = `Opening: ${cleanPath}`;
                filenameDisplay.title = cleanPath;
                const file = await invoke('open_file_path', { path: cleanPath });
                setEditorContent(file.content, `Editing: ${file.path}`);
                filenameDisplay.title = file.path;
            } catch (error) {
                filenameDisplay.textContent = 'Editor (Markdown + LaTeX)';
                filenameDisplay.title = '';
                terminal?.write(`\r\nUnable to open ${cleanPath}: ${error}\r\n`);
            }
        }

        function provideTerminalFileLinks(bufferLineNumber, callback) {
            const line = terminal?.buffer.active.getLine(bufferLineNumber - 1);
            if (!line) {
                callback(undefined);
                return;
            }

            const text = line.translateToString(true);
            const filePathPattern = /(?:~|\/|\.\.?\/)?[A-Za-z0-9._@%+-][^\s"'<>]*(?:\.md|\.markdown|\.txt)(?::\d+(?::\d+)?)?/gi;
            const links = [];
            let match = null;

            while ((match = filePathPattern.exec(text)) !== null) {
                const rawPath = cleanTerminalPath(match[0]);
                if (!rawPath || rawPath.endsWith('/')) continue;

                links.push({
                    text: rawPath,
                    range: {
                        start: { x: match.index + 1, y: bufferLineNumber },
                        end: { x: match.index + match[0].length, y: bufferLineNumber }
                    },
                    activate: () => openClickedTerminalFile(rawPath)
                });
            }

            callback(links.length > 0 ? links : undefined);
        }

        function resizeTerminal() {
            if (!terminalVisible || !terminal || !fitAddon) return;

            cancelAnimationFrame(terminalResizeFrame);
            terminalResizeFrame = requestAnimationFrame(() => {
                fitAddon.fit();
                invoke('terminal_resize', {
                    cols: terminal.cols,
                    rows: terminal.rows
                }).catch(() => {});
            });
        }

        async function ensureTerminal() {
            if (terminalStarted) return;

            terminal = new Terminal({
                cursorBlink: true,
                convertEol: true,
                fontFamily: '"Fira Code", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace',
                fontSize: 13,
                theme: {
                    background: '#070b16',
                    foreground: '#d9e2ef',
                    cursor: '#38bdf8',
                    selectionBackground: '#1e3a8a',
                    black: '#020617',
                    red: '#fb7185',
                    green: '#34d399',
                    yellow: '#facc15',
                    blue: '#60a5fa',
                    magenta: '#c084fc',
                    cyan: '#22d3ee',
                    white: '#e2e8f0',
                    brightBlack: '#475569',
                    brightRed: '#fda4af',
                    brightGreen: '#86efac',
                    brightYellow: '#fde047',
                    brightBlue: '#93c5fd',
                    brightMagenta: '#d8b4fe',
                    brightCyan: '#67e8f9',
                    brightWhite: '#f8fafc'
                }
            });
            fitAddon = new FitAddon();
            terminal.loadAddon(fitAddon);
            terminal.open(terminalElement);
            terminal.registerLinkProvider({ provideLinks: provideTerminalFileLinks });
            terminal.onData((data) => {
                handleTerminalCommandInput(data);
                invoke('terminal_write', { data }).catch((error) => {
                    terminal.write(`\r\nTerminal write failed: ${error}\r\n`);
                });
            });

            terminalStatus.textContent = 'Starting';
            terminal.write('Starting shell...\r\n');
            terminalOutputUnlisten = await listen('terminal-output', (event) => {
                terminal.write(event.payload);
            });

            fitAddon.fit();
            await invoke('terminal_spawn', {
                cols: terminal.cols,
                rows: terminal.rows
            });
            terminalStarted = true;
            terminalStatus.textContent = 'Running';
            resizeTerminal();
            setTimeout(resizeTerminal, 80);
        }

        async function toggleTerminal(forceVisible) {
            terminalVisible = typeof forceVisible === 'boolean' ? forceVisible : !terminalVisible;
            terminalPane.classList.toggle('hidden', !terminalVisible);
            toggleTerminalBtn.textContent = terminalVisible ? 'Hide Terminal' : 'Show Terminal';

            if (terminalVisible) {
                try {
                    await ensureTerminal();
                    resizeTerminal();
                    terminal.focus();
                } catch (error) {
                    terminalStatus.textContent = 'Error';
                    terminal?.write(`\r\nTerminal failed to start: ${error}\r\n`);
                }
            }
        }

        openFileBtn.addEventListener('click', () => fileInput.click());
        downloadBtn.addEventListener('click', downloadContent);
        copyHtmlBtn.addEventListener('click', () => copyToClipboard(copyHtmlBtn));
        checkUpdateBtn.addEventListener('click', checkForUpdate);
        installUpdateBtn.addEventListener('click', installDetectedUpdate);
        installCheckoutBtn.addEventListener('click', installCurrentCheckout);
        toggleTerminalBtn.addEventListener('click', () => toggleTerminal());
        closeTerminalBtn.addEventListener('click', () => toggleTerminal(false));
        toggleSourceBtn.addEventListener('click', () => {
            sourceCollapsed = !sourceCollapsed;
            editorContainer.classList.toggle('editor-collapsed', sourceCollapsed);
            toggleSourceBtn.textContent = sourceCollapsed ? 'Show Source' : 'Hide Source';
            resizeTerminal();
        });

        paneResizer.addEventListener('mousedown', () => {
            if (sourceCollapsed) return;
            isResizing = true;
            paneResizer.classList.add('dragging');
            document.body.style.userSelect = 'none';
        });

        document.addEventListener('mouseup', () => {
            if (!isResizing) return;
            isResizing = false;
            paneResizer.classList.remove('dragging');
            document.body.style.userSelect = '';
        });

        document.addEventListener('mousemove', (event) => {
            if (!isResizing || sourceCollapsed) return;
            const rect = editorContainer.getBoundingClientRect();
            const rawPercent = ((event.clientX - rect.left) / rect.width) * 100;
            const editorPercent = Math.min(80, Math.max(20, rawPercent));
            const previewPercent = 100 - editorPercent;
            editorPane.style.flex = `0 0 ${editorPercent}%`;
            previewPane.style.flex = `0 0 ${previewPercent}%`;
            resizeTerminal();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                editor.value = event.target.result;
                filenameDisplay.textContent = `Editing: ${file.name}`;
                updatePreview();
            };
            reader.readAsText(file);
        });

        let timeout = null;
        editor.addEventListener('input', () => {
            clearTimeout(timeout);
            timeout = setTimeout(updatePreview, 50);
        });

        document.addEventListener('keydown', (event) => {
            const mod = event.metaKey || event.ctrlKey;
            if (!mod) return;

            if (event.key.toLowerCase() === 'o') {
                event.preventDefault();
                fileInput.click();
            } else if (event.key.toLowerCase() === 's') {
                event.preventDefault();
                downloadContent();
            } else if (event.shiftKey && event.key.toLowerCase() === 'c') {
                event.preventDefault();
                copyToClipboard(copyHtmlBtn);
            } else if (event.key === '`') {
                event.preventDefault();
                toggleTerminal();
            }
        });

        window.addEventListener('resize', resizeTerminal);
        window.addEventListener('beforeunload', () => {
            terminalOutputUnlisten?.();
            if (terminalStarted) {
                invoke('terminal_kill').catch(() => {});
            }
        });

        editor.onscroll = function () {
            const scrollPercentage = editor.scrollTop / (editor.scrollHeight - editor.clientHeight || 1);
            preview.scrollTop = scrollPercentage * (preview.scrollHeight - preview.clientHeight);
        };

        async function loadInitialContent() {
            const params = new URLSearchParams(window.location.search);
            const fileParam = params.get('file');
            const fileDisplayName = params.get('name');

            if (!fileParam) {
                updatePreview();
                return;
            }

            try {
                const response = await fetch(fileParam, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`Failed to load ${fileParam}`);
                }

                const text = await response.text();
                const displayName = fileDisplayName || fileParam;
                setEditorContent(text, `Editing: ${displayName}`);
            } catch (_) {
                updatePreview();
            }
        }

        loadInitialContent();
        loadCurrentCheckoutInstaller();
        toggleTerminal(true);
    </script>
</body>
</html>
